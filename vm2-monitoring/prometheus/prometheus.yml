global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'node-exporter-vm2'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'node-exporter-vm1'
    static_configs:
      - targets: ['192.168.1.70:9100']
        labels:
          instance: 'vm1-core'

  - job_name: 'node-exporter-vm3'
    static_configs:
      - targets: ['192.168.1.73:9100']
        labels:
          instance: 'vm3-productivity'

  - job_name: 'cadvisor-vm1'
    static_configs:
      - targets: ['192.168.1.70:8081']
        labels:
          instance: 'vm1-core'

  - job_name: 'cadvisor-vm2'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'vm2-monitoring'

  - job_name: 'cadvisor-vm3'
    static_configs:
      - targets: ['192.168.1.73:8081']
        labels:
          instance: 'vm3-productivity'

  - job_name: 'uptime-kuma'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.1.70:3001']
