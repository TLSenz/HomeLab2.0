server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-vm2
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          instance: vm2
          __path__: /var/lib/docker/containers/*/*-json.log

  - job_name: syslog-vm2
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          instance: vm2
          __path__: /var/log/syslog

  - job_name: auth-vm2
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          instance: vm2
          __path__: /var/log/auth.log
