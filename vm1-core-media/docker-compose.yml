# =============================================================================
# VM1 - Core Infrastructure & Media Stack
# Host IP: 192.168.1.70
# =============================================================================
# Run: docker compose up -d

services:
  # =========================================================================
  # DNS AD-BLOCKER
  # =========================================================================
  pihole:
    container_name: pihole
    image: pihole/pihole:2024.07.0
    restart: unless-stopped
    hostname: pihole
    environment:
      TZ: ${TZ}
      WEBPASSWORD: ${PIHOLE_WEBPASSWORD}
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      FTLCONF_dns_listeningMode: all
      PIHOLE_DNS_: "1.1.1.1;1.0.0.1"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    networks:
      - proxy
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "dig", "+short", "@127.0.0.1", "pi.hole"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =========================================================================
  # REVERSE PROXY
  # =========================================================================
  nginx-proxy-manager:
    container_name: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    hostname: npm
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      TZ: ${TZ}
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    networks:
      - proxy
    depends_on:
      pihole:
        condition: service_healthy

  # =========================================================================
  # DOCKER MANAGEMENT
  # =========================================================================
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    hostname: portainer
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./portainer/data:/data
    networks:
      - proxy

  # =========================================================================
  # CLOUDFLARE TUNNEL
  # =========================================================================
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - proxy

  # =========================================================================
  # UPTIME MONITORING
  # =========================================================================
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    hostname: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma/data:/app/data
    networks:
      - proxy

  # =========================================================================
  # ARR STACK - INDEXER MANAGER
  # =========================================================================
  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    restart: unless-stopped
    hostname: prowlarr
    environment:
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./arr/prowlarr:/config
    networks:
      - proxy
      - media

  # =========================================================================
  # ARR STACK - MOVIES (Radarr)
  # =========================================================================
  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    restart: unless-stopped
    hostname: radarr
    environment:
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./arr/radarr:/config
      - /mnt/nas/movies:/media/movies
      - /mnt/nas/downloads:/downloads
    networks:
      - proxy
      - media
    depends_on:
      - prowlarr
      - qbittorrent

  # =========================================================================
  # ARR STACK - TV SERIES (Sonarr)
  # =========================================================================
  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    restart: unless-stopped
    hostname: sonarr
    environment:
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./arr/sonarr:/config
      - /mnt/nas/movies:/media/tv
      - /mnt/nas/downloads:/downloads
    networks:
      - proxy
      - media
    depends_on:
      - prowlarr
      - qbittorrent

  # =========================================================================
  # ARR STACK - MUSIC (Lidarr)
  # =========================================================================
  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    restart: unless-stopped
    hostname: lidarr
    environment:
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./arr/lidarr:/config
      - /mnt/nas/music:/media/music
      - /mnt/nas/downloads:/downloads
    networks:
      - proxy
      - media
    depends_on:
      - prowlarr
      - qbittorrent

  # =========================================================================
  # DOWNLOAD CLIENT
  # =========================================================================
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    hostname: qbittorrent
    environment:
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
      WEBUI_PORT: "8090"
    volumes:
      - ./arr/qbittorrent:/config
      - /mnt/nas/downloads:/downloads
    networks:
      - proxy
      - media
    ports:
      - "6881:6881"
      - "6881:6881/udp"

  # =========================================================================
  # MUSIC STREAMING
  # =========================================================================
  navidrome:
    container_name: navidrome
    image: deluan/navidrome:latest
    restart: unless-stopped
    hostname: navidrome
    environment:
      TZ: ${TZ}
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 48h
    volumes:
      - ./navidrome/data:/data
      - /mnt/nas/music:/music:ro
    networks:
      - proxy

  # =========================================================================
  # NODE EXPORTER (Host Metrics)
  # =========================================================================
  node-exporter:
    container_name: node-exporter
    image: prom/node-exporter:latest
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"

  # =========================================================================
  # CADVISOR (Container Metrics)
  # =========================================================================
  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8081:8080"

networks:
  proxy:
    name: homelab-proxy
    driver: bridge
  media:
    name: homelab-media
    driver: bridge
